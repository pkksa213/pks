name: Publiczny rozkład dla aplikacji
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/schedule-feed.yml'
      - 'scripts/build_feed.py'
  workflow_run:
    workflows: ['Aktualizuj dane PKS i wgraj stronę']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-schedule-feed
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Przygotuj tylko publiczne dane
        run: python3 scripts/build_feed.py --output "$RUNNER_TEMP/public-schedule"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public-schedule
      - name: Opublikuj rozkład
        id: deployment
        uses: actions/deploy-pages@v4
