name: Aktualizuj dane PKS i wgraj stronę

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch: {}   # <- to jest przycisk "Run workflow" = "odśwież teraz"

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pobierz aktualny rozkład PKS (GTFS) i zaktualizuj data.json
        run: python3 scripts/update_pks_gtfs.py

      - name: Zapisz zmiany w repozytorium (historia rozkładu PKS)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Automatyczna aktualizacja danych PKS"
          git push

      - name: Wgraj stronę na hosting przez FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          BASE="ftp://${FTP_HOST}${FTP_REMOTE_DIR}"
          echo "Cel: $BASE (host i katalog nie są tu ujawniane w pełni przez GitHub, ale struktura się zgadza)"

          upload() {
            echo "==> Wgrywam $1"
            curl --silent --show-error --ftp-create-dirs \
              -u "${FTP_USER}:${FTP_PASS}" \
              -T "$1" "$BASE/$1"
          }

          upload index.html
          upload style.css
          upload data.json
          upload js/calendar.js
          upload js/services.js
          upload js/app.js

          echo "Gotowe."
